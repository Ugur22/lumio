name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: cd frontend && npm ci
      - run: make check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      # The Cypress binary comes from npm's postinstall, so the cache above is restored before this runs.
      - run: cd frontend && npm ci
      - run: make e2e
      - if: failure()
        run: tail -n 60 logs/app.jsonl logs/e2e-server.out 2>/dev/null || true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so a key committed and later deleted is still found.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
